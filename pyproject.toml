[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aml"
version = "0.1.0"
description = "Graph-based anti-money-laundering collusion detection on the IBM synthetic transactions dataset"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Shrinivas Loni" }]
dependencies = [
    "pandas>=2.1",
    "numpy>=1.26",
    "pyarrow>=14",
    "scikit-learn>=1.3",
    "xgboost>=2.0",
    "python-igraph>=0.11",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ipykernel>=6"]
gnn = ["torch>=2.2", "torch_geometric>=2.5"]
serve = ["fastapi>=0.110", "uvicorn>=0.29"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
